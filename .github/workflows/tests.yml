# =============================================================================
# tests — pipeline de testes do projeto (node:test, zero build) · opensource-project
#
# NOTA (para o agente): TODOS os `uses:` seguem o formato obrigatório
#     owner/repo@<PIN_SHA> # vX.Y.Z
# fixados por `bash scripts/oss-pin-actions.sh` (skill opensource-project).
#
# CONTEXT DE REQUIRED STATUS CHECK: o ruleset exige o NOME DO JOB agregador
# `tests-ok` (nome estável) — ver .github/rulesets/regras-main.json.
# =============================================================================

name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Privilégio mínimo: testes só leem o repositório.
permissions:
  contents: read

# Um run por ref; o novo cancela o obsoleto (poupa minutos).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.runtime-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        runtime-version: ["22"]
        # Matriz enxuta: acrescente SO/versões só as que suporta mesmo.
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.runtime-version }}
          cache: npm # cache por hash do package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      # Smoke: importa TODOS os módulos e sobe o schema SQLite. O auto-restore
      # fica DESLIGADO: com base vazia + histórico do git ele re-ergueria o
      # acervo inteiro no runner (a allowlist inclui `status`).
      - name: Smoke (imports + schema)
        run: CRAWLER_AUTO_RESTORE=false npm run status

      - name: Unit tests (node:test)
        run: npm test

  # Job agregador: nome ESTÁVEL → é este o `context` do required status check.
  # Se qualquer perna da matriz falhar, este job falha e o PR fica bloqueado.
  tests-ok:
    name: tests-ok
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any matrix leg failed
        if: needs.test.result != 'success'
        run: |
          echo "::error::Houve pernas da matriz com falha — veja o job 'test'"
          exit 1
      - name: Sumário do run
        run: echo "### tests ✅" >> "$GITHUB_STEP_SUMMARY"
