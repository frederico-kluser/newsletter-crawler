<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Administração do backend de análise JEV × webhook do acervo de newsletters." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Admin — Acervo</title>
    <script>
      // Mesmo pré-paint do index.html (tema + idioma antes do 1º paint, zero FOUC).
      try {
        var t = localStorage.getItem('nc-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
      try {
        var l = localStorage.getItem('nc-locale');
        if (l !== 'pt' && l !== 'en') {
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
          l = String(nav).toLowerCase().split('-')[0] === 'pt' ? 'pt' : 'en';
        }
        document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
